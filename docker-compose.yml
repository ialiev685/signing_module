# version: "3.0"

services:
  signing_app:
    build:
      context: ./verification_module_via_pycades
      dockerfile: Dockerfile
    container_name: signing_app
  
    volumes:
      - ./verification_module_via_pycades:/app # Монтируем текущую директорию 
      - /app/lib/pycades # создает отдельный volume для /app/lib/pycades
    ports:
      - "8004:8000"
    environment:
      - PYTHONPATH=/app/lib/pycades
    # для dev режима
    command: fastapi dev main.py --host 0.0.0.0 --port 8000 --reload



  decoding-service:
    build:
      context: ./decoding_module_via_node
      dockerfile: Dockerfile
    container_name: decoding-module
    ports:
      - "8005:8005"  # Пробрасываем порт приложения
    environment:
      - PORT=8005
    volumes:
      - ./decoding_module_via_node/dist:/app/dist
      - /app/node_modules  # Исключаем node_modules из монтирования
    restart: unless-stopped
    depends_on:
      - signing_app 

